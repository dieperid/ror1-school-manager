# MySQL. Versions 5.7.8 and up are supported.
#   gem install mysql2
#
#   Ensure the MySQL 2 gem is defined in your Gemfile
#   gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>

production_default: &production_default
  <<: *default
  username: <%= ENV.fetch("DB_USERNAME", "ror1_school_manager") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_DEVELOPMENT", "ror1_school_manager_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "ror1_school_manager_test") %>

production:
  primary:
    <<: *production_default
    database: <%= ENV.fetch("DB_NAME_PRODUCTION", "ror1_school_manager_production") %>
  cache:
    <<: *production_default
    database: <%= ENV.fetch("DB_NAME_PRODUCTION_CACHE", "ror1_school_manager_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_default
    database: <%= ENV.fetch("DB_NAME_PRODUCTION_QUEUE", "ror1_school_manager_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_default
    database: <%= ENV.fetch("DB_NAME_PRODUCTION_CABLE", "ror1_school_manager_production_cable") %>
    migrations_paths: db/cable_migrate
